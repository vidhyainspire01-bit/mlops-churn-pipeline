resources:
  jobs:
    churn_promotion_job:
      name: "[${bundle.target}] Churn Model Promotion"
      description: "Champion/Challenger comparison and promotion"

      tasks:
        - task_key: evaluate_and_promote
          spark_python_task:
            python_file: ../src/churn_model/training/promote.py
            parameters:
              - "--env"
              - "${bundle.target}"
          environment_key: default_env

      environments:
        - environment_key: default_env
          spec:
            client: "3"
            dependencies:
              - ../dist/churn_model-0.1.0-py3-none-any.whl
              - pyyaml>=6.0

      tags:
        team: "mlops"
        model: "churn"
        environment: "${bundle.target}"
        job_type: "promotion"
